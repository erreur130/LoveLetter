name: Build Qt (QMake) Multi-Platform

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
            qt-version: '6.11.1'
          - os: windows-latest
            target: windows
            qt-version: '6.11.1'
          - os: macos-latest
            target: macos
            qt-version: '6.11.1'

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ matrix.qt-version }}
        target: desktop
        setup-python: true
        cache: true

    - name: Setup MSVC
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure (QMake)
      shell: bash
      run: |
        mkdir build
        cd build
        qmake ../FichiersQT/FichiersQT.pro

    - name: Remove AGL framework (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        sed -i '' 's/-framework AGL//g' build/Makefile
        sed -i '' 's/-framework AGL//g' build/Makefile.Release 2>/dev/null || true
        sed -i '' 's/-framework AGL//g' build/Makefile.Debug 2>/dev/null || true

    - name: Build (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        cd build
        make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

    - name: Build (Windows)
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        cd build
        nmake

    # --- DÉPLOIEMENT WINDOWS ---
    - name: Deploy Windows
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        cd build\release
        windeployqt LoveLetter.exe --release --compiler-runtime

    - name: Clean release folder (Windows)
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        cd build\release
        del *.obj *.cpp *.h *.res 2>nul

    # --- DÉPLOIEMENT MACOS ---
    - name: Deploy macOS
      if: matrix.os == 'macos-latest'
      run: |
        cd build
        macdeployqt LoveLetter.app -dmg -always-overwrite

    # --- DÉPLOIEMENT LINUX ---
    - name: Install dependencies Linux
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y libfuse2 patchelf

    - name: Deploy Linux (AppImage)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        wget -O linuxdeployqt https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
        chmod +x linuxdeployqt
        cd build
        printf '[Desktop Entry]\nName=LoveLetter\nExec=LoveLetter\nIcon=LoveLetter\nType=Application\nCategories=Game;CardGame;\n' > LoveLetter.desktop
        cp ../FichiersQT/Images/Love_Letter_icon.png LoveLetter.png
        APPIMAGE_EXTRACT_AND_RUN=1 ../linuxdeployqt LoveLetter -appimage -bundle-non-qt-libs

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.target }}-build
        retention-days: 5
        path: |
          build/release/
          build/*.dmg
          build/*.AppImage